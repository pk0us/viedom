<header class="site-header">
  <div class="header-inner">
    <a class="wordmark" routerLink="/"
      ><span class="brand-mark" aria-hidden="true">v.</span>viedom</a
    >
    <span class="city-label">Thessaloniki, Greece</span>
    <button
      #menuButton
      class="menu-toggle"
      type="button"
      aria-controls="public-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
    >
      Menu <span aria-hidden="true">☰</span>
    </button>
    <nav id="public-navigation" aria-label="Main navigation" [class.is-open]="menuOpen()">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Home</a
      >
      <a routerLink="/owner" class="workspace-link"
        >Owner workspace <span aria-hidden="true">↗</span></a
      >
    </nav>
  </div>
</header>
<main id="main-content" tabindex="-1"><router-outlet /></main>
<footer class="site-footer">
  <div class="footer-inner">
    <span>Viedom <span class="muted">· A place to call yours.</span></span
    ><a routerLink="/health">Service status</a>
  </div>
</footer>
